<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactividad con el DOM</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <main class="tarjeta">
    <h1 class="titulo">Interactividad con el DOM</h1>
    <p class="subtitulo">
      Haz clic en el botón y observa cómo JavaScript actualiza el contador.
    </p>

    <div class="contador-contenedor">
      <span id="contador" class="contador" aria-live="polite">0</span>
      <span class="contador-etiqueta">likes</span>
    </div>

    <div class="acciones">
      <button id="btn-like" class="btn-like" type="button">Dar like</button>
    </div>
  </main>

</body>
</html>
